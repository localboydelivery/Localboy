<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOCAL BOY - Search</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #fafafa; color: #1a202c; }
        a { text-decoration: none; color: inherit; }
        .clickable:active { transform: scale(0.97); opacity: 0.8; }

        /* Top Search Bar Header */
        .search-header { display: flex; align-items: center; padding: 15px 20px; background: #ffffff; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.04); gap: 15px;}
        .back-btn { font-size: 20px; color: #1a202c; cursor: pointer; }
        
        .search-input-wrapper { flex: 1; display: flex; align-items: center; background: #f7fafc; border-radius: 14px; padding: 10px 15px; border: 1px solid #e2e8f0; transition: 0.3s;}
        .search-input-wrapper.active { border-color: #ff5200; background: #fff; box-shadow: 0 0 0 3px rgba(255, 82, 0, 0.1);}
        
        .search-input-wrapper input { flex: 1; border: none; background: transparent; outline: none; font-size: 14px; padding: 0 10px; color: #1a202c;}
        
        /* Mic Icon Styling */
        .mic-btn { color: #4a5568; font-size: 18px; cursor: pointer; padding: 5px; transition: 0.3s;}
        .mic-btn.listening { color: #ff5200; animation: pulse 1s infinite; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* Recent Searches & Trending */
        .search-content { padding: 20px; }
        .section-title { font-size: 14px; font-weight: 700; color: #1a202c; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;}
        .section-title span { font-size: 11px; color: #ff5200; cursor: pointer; font-weight: 600;}
        
        .chip-container { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 25px; }
        .chip { background: #ffffff; border: 1px solid #e2e8f0; padding: 8px 15px; border-radius: 20px; font-size: 12px; font-weight: 500; color: #4a5568; display: flex; align-items: center; gap: 6px; cursor: pointer;}
        .chip i { color: #a0aec0; font-size: 10px;}

        /* Search Results */
        #searchResults { display: none; margin-top: 20px;}
        .result-item { display: flex; align-items: center; gap: 15px; padding: 15px 0; border-bottom: 1px solid #edf2f7; cursor: pointer;}
        .result-img { width: 50px; height: 50px; border-radius: 10px; object-fit: cover;}
        .result-info { flex: 1; }
        .result-info h4 { font-size: 14px; font-weight: 600; color: #1a202c;}
        .result-info p { font-size: 11px; color: #718096; margin-top: 2px;}
        .result-arrow { color: #cbd5e0; font-size: 14px;}
    </style>
</head>
<body>

    <!-- Header with Search Input & Mic -->
    <div class="search-header">
        <a href="home.html" class="back-btn clickable"><i class="fa-solid fa-arrow-left"></i></a>
        <div class="search-input-wrapper" id="searchWrapper">
            <i class="fa-solid fa-magnifying-glass" style="color: #ff5200;"></i>
            <input type="text" id="searchInput" placeholder="Search for food, groceries..." autofocus onkeyup="filterResults()">
            <!-- 🔴 MIC BUTTON -->
            <i class="fa-solid fa-microphone mic-btn" id="micBtn" onclick="startVoiceSearch()"></i>
        </div>
    </div>

    <!-- Default Search View (Recent & Trending) -->
    <div class="search-content" id="defaultSearch">
        <div class="section-title">Recent Searches <span>CLEAR</span></div>
        <div class="chip-container">
            <div class="chip clickable" onclick="setSearch('Chicken Biryani')"><i class="fa-solid fa-clock-rotate-left"></i> Chicken Biryani</div>
            <div class="chip clickable" onclick="setSearch('Pizza')"><i class="fa-solid fa-clock-rotate-left"></i> Pizza</div>
            <div class="chip clickable" onclick="setSearch('Milk')"><i class="fa-solid fa-clock-rotate-left"></i> Milk</div>
        </div>

        <div class="section-title">Trending Near You <i class="fa-solid fa-fire-flame-curved" style="color: #ff5200;"></i></div>
        <div class="chip-container">
            <div class="chip clickable" onclick="setSearch('Burger')"><i class="fa-solid fa-arrow-trend-up"></i> Burger</div>
            <div class="chip clickable" onclick="setSearch('Ice Cream')"><i class="fa-solid fa-arrow-trend-up"></i> Ice Cream</div>
            <div class="chip clickable" onclick="setSearch('Dosa')"><i class="fa-solid fa-arrow-trend-up"></i> Dosa</div>
            <div class="chip clickable" onclick="setSearch('Paneer Butter Masala')"><i class="fa-solid fa-arrow-trend-up"></i> Paneer Butter Masala</div>
        </div>
    </div>

    <!-- Real-time Search Results -->
    <div class="search-content" id="searchResults">
        <div class="section-title">Search Results</div>
        
        <div id="resultsContainer">
            <!-- Items will be generated here by JavaScript -->
        </div>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const searchWrapper = document.getElementById('searchWrapper');
        const micBtn = document.getElementById('micBtn');
        const defaultSearch = document.getElementById('defaultSearch');
        const searchResults = document.getElementById('searchResults');
        const resultsContainer = document.getElementById('resultsContainer');

        // Input Focus Styling
        searchInput.addEventListener('focus', () => searchWrapper.classList.add('active'));
        searchInput.addEventListener('blur', () => searchWrapper.classList.remove('active'));

        // 🔴 Voice Search Logic (Web Speech API)
        function startVoiceSearch() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                
                recognition.lang = 'en-IN'; // Indian English
                recognition.interimResults = false;
                recognition.maxAlternatives = 1;

                recognition.onstart = function() {
                    micBtn.classList.add('listening');
                    searchInput.placeholder = "Listening... Speak now";
                    searchInput.value = "";
                };

                recognition.onresult = function(event) {
                    const speechResult = event.results[0][0].transcript;
                    searchInput.value = speechResult;
                    filterResults(); // Trigger search automatically
                };

                recognition.onerror = function(event) {
                    alert('Voice recognition error. Please try typing.');
                    resetMic();
                };

                recognition.onend = function() {
                    resetMic();
                };

                recognition.start();
            } else {
                alert("Your browser does not support Voice Search. Please type your search.");
            }
        }

        function resetMic() {
            micBtn.classList.remove('listening');
            searchInput.placeholder = "Search for food, groceries...";
        }

        function setSearch(keyword) {
            searchInput.value = keyword;
            filterResults();
        }

        // Dummy Data for Search Results
        const dummyData = [
            { name: "Chicken Dum Biryani", type: "Restaurant", img: "https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?q=80&w=200&auto=format&fit=crop" },
            { name: "Farmhouse Pizza", type: "Food", img: "https://images.unsplash.com/photo-1513104890138-7c749659a591?q=80&w=200&auto=format&fit=crop" },
            { name: "Chicken Zinger Burger", type: "Food", img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=200&auto=format&fit=crop" },
            { name: "Amul Taaza Milk (1L)", type: "Grocery", img: "https://images.unsplash.com/photo-1550583724-b2692b85b150?q=80&w=200&auto=format&fit=crop" },
            { name: "Masala Dosa", type: "Food", img: "https://images.unsplash.com/photo-1589301760014-d929f39ce9b0?q=80&w=200&auto=format&fit=crop" },
        ];

        // Live Filtering Logic
        function filterResults() {
            const query = searchInput.value.toLowerCase().trim();
            
            if (query.length > 0) {
                defaultSearch.style.display = 'none';
                searchResults.style.display = 'block';
                
                resultsContainer.innerHTML = '';
                
                const filtered = dummyData.filter(item => item.name.toLowerCase().includes(query));
                
                if (filtered.length > 0) {
                    filtered.forEach(item => {
                        resultsContainer.innerHTML += `
                            <div class="result-item clickable">
                                <img src="${item.img}" class="result-img" alt="${item.name}">
                                <div class="result-info">
                                    <h4>${item.name}</h4>
                                    <p>${item.type}</p>
                                </div>
                                <i class="fa-solid fa-arrow-up-right-from-square result-arrow"></i>
                            </div>
                        `;
                    });
                } else {
                    resultsContainer.innerHTML = `
                        <div style="text-align:center; padding:30px; color:#a0aec0;">
                            <i class="fa-solid fa-magnifying-glass" style="font-size:30px; margin-bottom:10px;"></i>
                            <p>No results found for "${query}"</p>
                        </div>
                    `;
                }
            } else {
                defaultSearch.style.display = 'block';
                searchResults.style.display = 'none';
            }
        }
    </script>
</body>
</html>
