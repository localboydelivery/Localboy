<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOCAL BOY - Order Success</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: linear-gradient(135deg, #10b981, #059669); color: #ffffff; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 24px; overflow: hidden; }
        a { text-decoration: none; }
        .success-circle { width: 105px; height: 105px; background: #ffffff; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin-bottom: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .success-circle i { font-size: 52px; color: #10b981; }
        @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .order-id-pill { background: rgba(255,255,255,0.2); padding: 5px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; margin-bottom: 12px; letter-spacing: 0.5px; }
        h1 { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
        p { font-size: 14px; opacity: 0.92; margin-bottom: 36px; line-height: 1.5; font-weight: 500; }
        .btn-track { background: #ffffff; color: #059669; width: 100%; max-width: 310px; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 800; margin-bottom: 14px; display: flex; justify-content: center; align-items: center; gap: 8px; box-shadow: 0 8px 20px rgba(0,0,0,0.12); }
        .btn-home { background: transparent; color: #ffffff; width: 100%; max-width: 310px; padding: 15px; border-radius: 14px; font-size: 15px; font-weight: 700; border: 2px solid rgba(255,255,255,0.8); display: block; }
    </style>
</head>
<body>
    <div class="success-circle"><i class="fa-solid fa-check"></i></div>
    <div class="order-id-pill" id="orderIdDisplay">Order Confirmed</div>
    <h1>Order Placed!</h1>
    <p>Your order has been sent to the store and <br> a delivery partner will be assigned shortly.</p>
    <a href="track.html" id="trackOrderBtn" class="btn-track"><i class="fa-solid fa-location-crosshairs"></i> Live Track Order</a>
    <a href="home.html" class="btn-home">Back to Home</a>

    <script>
        window.addEventListener('DOMContentLoaded', function() {
            localStorage.setItem('localBoyCart', JSON.stringify({ restId: null, items: {}, totalQty: 0 }));
            localStorage.setItem('activeOrder', 'true');

            const lastOrderId = localStorage.getItem('lastOrderId');
            if (lastOrderId) {
                document.getElementById('orderIdDisplay').innerText = `Order ID: #${lastOrderId}`;
                document.getElementById('trackOrderBtn').href = `track.html?id=${lastOrderId}`;
            }
        });
    </script>
</body>
</html>
