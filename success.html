<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOCAL BOY - Order Success</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #10b981; color: #ffffff; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        a { text-decoration: none; }
        .success-circle { width: 100px; height: 100px; background: #ffffff; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .success-circle i { font-size: 50px; color: #10b981; }
        @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        h1 { font-size: 26px; font-weight: 800; margin-bottom: 10px; }
        p { font-size: 14px; opacity: 0.9; margin-bottom: 40px; line-height: 1.5; }
        .btn-track { background: #ffffff; color: #10b981; width: 100%; max-width: 300px; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 700; margin-bottom: 15px; display: block; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn-home { background: transparent; color: #ffffff; width: 100%; max-width: 300px; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 600; border: 1.5px solid #ffffff; display: block; }
    </style>
</head>
<body>
    <div class="success-circle"><i class="fa-solid fa-check"></i></div>
    <h1>Order Placed!</h1>
    <p>Your food is being prepared and <br> will reach you soon.</p>
    <a href="track.html" class="btn-track">Track Order</a>
    <a href="home.html" class="btn-home">Back to Home</a>
    <script>
        window.onload = function() {
            localStorage.setItem('localBoyCart', JSON.stringify({ restId: null, items: {}, totalQty: 0 }));
            localStorage.setItem('activeOrder', 'true');
        };
    </script>
</body>
</html>
