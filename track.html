<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOCAL BOY - Track Order</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase Web SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #ffffff; color: #1a202c; }
        a { text-decoration: none; }
        
        .back-btn-float { position: absolute; top: 20px; left: 20px; width: 40px; height: 40px; background: #f7fafc; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); z-index: 100; font-size: 20px; color: #1a202c;}
        
        .track-details { padding: 90px 20px 20px; min-height: 100vh; background: #ffffff; }
        .eta-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px dashed #edf2f7;}
        .eta-header h2 { font-size: 22px; font-weight: 800; color: #10b981; }
        .eta-header p { font-size: 13px; color: #718096; font-weight: 600; margin-top: 4px;}
        
        .timeline { padding-left: 10px; margin-top: 10px;}
        .timeline-item { display: flex; gap: 15px; margin-bottom: 35px; position: relative; }
        .timeline-item::before { content: ''; position: absolute; left: 11px; top: 25px; bottom: -40px; width: 2px; background: #edf2f7; }
        .timeline-item:last-child::before { display: none; }
        .timeline-icon { width: 24px; height: 24px; border-radius: 50%; background: #edf2f7; display: flex; align-items: center; justify-content: center; z-index: 1; color: #a0aec0; font-size: 10px; }
        .timeline-content h4 { font-size: 15px; font-weight: 700; color: #a0aec0; }
        .timeline-content p { font-size: 12px; color: #cbd5e0; margin-top: 3px; line-height: 1.4;}

        .timeline-item.completed .timeline-icon { background: #10b981; color: white; }
        .timeline-item.completed .timeline-content h4 { color: #1a202c; }
        .timeline-item.completed .timeline-content p { color: #718096; }
        .timeline-item.completed::before { background: #10b981; } 

        .timeline-item.current .timeline-icon { background: #ff5200; color: white; animation: pulse 1.5s infinite; }
        .timeline-item.current .timeline-content h4 { color: #ff5200; }
        .timeline-item.current .timeline-content p { color: #718096; }

        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 82, 0, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(255, 82, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 82, 0, 0); } }
    </style>
</head>
<body>

    <a href="javascript:history.back()" class="back-btn-float"><i class="fa-solid fa-arrow-left"></i></a>

    <div class="track-details">
        <div class="eta-header">
            <div>
                <h2 id="eta-text">Locating Order...</h2>
                <p id="order-id-display">Fetching Details...</p>
            </div>
            <i class="fa-solid fa-fire-burner" id="header-icon" style="font-size: 30px; color: #ff5200;"></i>
        </div>

        <div class="timeline">
            <div class="timeline-item" id="step-placed">
                <div class="timeline-icon"><i class="fa-solid fa-check"></i></div>
                <div class="timeline-content"><h4>Order Placed</h4><p>Waiting for restaurant to accept.</p></div>
            </div>
            <div class="timeline-item" id="step-preparing">
                <div class="timeline-icon"><i class="fa-solid fa-fire-burner"></i></div>
                <div class="timeline-content"><h4>Preparing</h4><p>Restaurant is preparing your items.</p></div>
            </div>
            <div class="timeline-item" id="step-ready">
                <div class="timeline-icon"><i class="fa-solid fa-bag-shopping"></i></div>
                <div class="timeline-content"><h4>Food Ready</h4><p>Order is packed and ready.</p></div>
            </div>
            <div class="timeline-item" id="step-ontheway">
                <div class="timeline-icon"><i class="fa-solid fa-motorcycle"></i></div>
                <div class="timeline-content"><h4>On the Way</h4><p>Your order is out for delivery.</p></div>
            </div>
            <div class="timeline-item" id="step-delivered">
                <div class="timeline-icon"><i class="fa-solid fa-house-chimney"></i></div>
                <div class="timeline-content"><h4>Delivered</h4><p>Enjoy your order!</p></div>
            </div>
        </div>
    </div>

    <!-- Firebase Logic -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC9PnjAdBeOEy0TLQvUBJUznlZFKSS82uI",
            authDomain: "sri-vishnu-priya-finance-c591f.firebaseapp.com",
            databaseURL: "https://sri-vishnu-priya-finance-c591f-default-rtdb.firebaseio.com",
            projectId: "sri-vishnu-priya-finance-c591f",
            storageBucket: "sri-vishnu-priya-finance-c591f.firebasestorage.app"
        };
        
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const database = firebase.database();

        const urlParams = new URLSearchParams(window.location.search);
        let trackingId = urlParams.get('id') || localStorage.getItem('lastOrderId');

        if (trackingId) {
            database.ref('orders/' + trackingId).on('value', (snapshot) => {
                const orderData = snapshot.val();
                
                if (orderData) {
                    // Dynamically fetch actual restaurant/store name
                    if(orderData.restaurantId === 'grocery_store') {
                        document.getElementById('order-id-display').innerText = `Order #${orderData.orderId} • Local Boy Groceries`;
                    } else {
                        database.ref('restaurant_profiles/' + orderData.restaurantId).once('value').then(resSnap => {
                            if(resSnap.exists()) {
                                document.getElementById('order-id-display').innerText = `Order #${orderData.orderId} • ${resSnap.val().name}`;
                            } else {
                                document.getElementById('order-id-display').innerText = `Order #${orderData.orderId} • Restaurant`;
                            }
                        });
                    }
                    
                    updateTimeline(orderData.status);
                    
                    if (orderData.status === 'Delivered') {
                        localStorage.setItem('activeOrder', 'false');
                        document.getElementById('eta-text').innerText = "Delivered!";
                        document.getElementById('eta-text').style.color = "#10b981";
                        document.getElementById('header-icon').className = "fa-solid fa-face-smile-beam fa-bounce";
                        document.getElementById('header-icon').style.color = "#10b981";
                    } else if (orderData.status === 'Cancelled') {
                        localStorage.setItem('activeOrder', 'false');
                        document.getElementById('eta-text').innerText = "Order Cancelled";
                        document.getElementById('eta-text').style.color = "#ef4444";
                        document.getElementById('header-icon').className = "fa-solid fa-circle-xmark";
                        document.getElementById('header-icon').style.color = "#ef4444";
                    }
                }
            });
        } else {
            document.getElementById('eta-text').innerText = "No Active Order";
            document.getElementById('order-id-display').innerText = "Redirecting...";
            setTimeout(() => { window.location.replace("home.html"); }, 2000);
        }

        function updateTimeline(status) {
            const steps = ['placed', 'preparing', 'ready', 'ontheway', 'delivered'];
            
            let currentStepIndex = 0;
            if (status === 'Placed') {
                currentStepIndex = 0;
                document.getElementById('eta-text').innerText = "Waiting for confirmation";
                document.getElementById('header-icon').className = "fa-solid fa-clock-rotate-left fa-spin-pulse";
            }
            else if (status === 'Preparing') {
                currentStepIndex = 1;
                document.getElementById('eta-text').innerText = "Preparing Order...";
                document.getElementById('header-icon').className = "fa-solid fa-fire-burner fa-bounce";
            }
            else if (status === 'Ready') {
                currentStepIndex = 2;
                document.getElementById('eta-text').innerText = "Order is Ready!";
                document.getElementById('header-icon').className = "fa-solid fa-bag-shopping fa-bounce";
            }
            else if (status === 'On the Way') {
                currentStepIndex = 3;
                document.getElementById('eta-text').innerText = "Arriving in 15 mins";
                document.getElementById('header-icon').className = "fa-solid fa-motorcycle fa-bounce";
            }
            else if (status === 'Delivered') {
                currentStepIndex = 4;
            }
            else if (status === 'Cancelled') return;

            steps.forEach(s => {
                document.getElementById(`step-${s}`).classList.remove('completed', 'current');
            });

            for (let i = 0; i <= currentStepIndex; i++) {
                if (i === currentStepIndex) {
                    document.getElementById(`step-${steps[i]}`).classList.add('current');
                } else {
                    document.getElementById(`step-${steps[i]}`).classList.add('completed');
                }
            }
        }
    </script>
</body>
</html>
