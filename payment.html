<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOCAL BOY - Payment</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase Web SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #f8fafc; color: #1e293b; padding-bottom: 90px; }
        a { text-decoration: none; color: inherit; }
        .clickable:active { transform: scale(0.97); opacity: 0.9; }

        .top-bar { display: flex; align-items: center; padding: 15px 20px; background: #ffffff; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
        .back-btn { font-size: 20px; margin-right: 15px; width: 38px; height: 38px; display: flex; justify-content: center; align-items: center; border-radius: 50%; background: #f1f5f9; cursor: pointer; color: #1e293b; transition: 0.2s;}
        .top-bar h2 { font-size: 18px; font-weight: 800; color: #0f172a;}

        .amount-card { background: #ffffff; margin: 20px; padding: 25px; border-radius: 20px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.02); border: 1px solid #f1f5f9;}
        .amount-card p { font-size: 14px; color: #64748b; font-weight: 600; margin-bottom: 5px; }
        .amount-card h1 { font-size: 32px; font-weight: 800; color: #0f172a; }

        .payment-section { background: #ffffff; margin: 0 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); overflow: hidden; border: 1px solid #f1f5f9;}
        .payment-title { font-size: 13px; font-weight: 700; padding: 20px 20px 10px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px;}
        
        .pay-option { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid #f1f5f9; cursor: pointer; transition: 0.2s;}
        .pay-option:active { background: #f8fafc; }
        .pay-details { display: flex; align-items: center; gap: 15px; }
        .pay-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 20px; }
        .pay-details h4 { font-size: 15px; font-weight: 700; color: #1e293b; }
        
        .radio-circle { width: 22px; height: 22px; border: 2px solid #cbd5e0; border-radius: 50%; display: flex; justify-content: center; align-items: center; transition: 0.2s;}
        .radio-circle.active { border-color: #10b981; }
        .radio-circle.active::after { content: ''; width: 12px; height: 12px; background: #10b981; border-radius: 50%; }

        .pay-btn-container { position: fixed; bottom: 0; left: 0; width: 100%; background: #ffffff; padding: 15px 20px; box-shadow: 0 -10px 30px rgba(0,0,0,0.05); z-index: 1000; border-top-left-radius: 24px; border-top-right-radius: 24px;}
        .btn-pay { width: 100%; background: #ff5200; color: white; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 800; border: none; cursor: pointer; box-shadow: 0 8px 20px rgba(255, 82, 0, 0.25);}
        .btn-pay:disabled { opacity: 0.7; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="javascript:history.back()" class="back-btn clickable"><i class="fa-solid fa-arrow-left"></i></a>
        <h2>Payments</h2>
    </div>

    <div class="amount-card">
        <p>Amount to Pay</p>
        <h1 id="payAmount"><i class="fa-solid fa-spinner fa-spin" style="font-size: 24px;"></i></h1>
    </div>

    <div class="payment-section">
        <div class="payment-title">Recommended Options</div>
        
        <div class="pay-option clickable" onclick="selectPayment(this)">
            <div class="pay-details">
                <div class="pay-icon" style="background: #ecfdf5; color: #10b981;"><i class="fa-brands fa-google-pay"></i></div>
                <h4>Google Pay</h4>
            </div>
            <div class="radio-circle"></div>
        </div>

        <div class="pay-option clickable" onclick="selectPayment(this)">
            <div class="pay-details">
                <div class="pay-icon" style="background: #eff6ff; color: #3b82f6;"><i class="fa-solid fa-building-columns"></i></div>
                <h4>PhonePe / UPI</h4>
            </div>
            <div class="radio-circle"></div>
        </div>

        <div class="payment-title" style="border-top: 6px solid #f8fafc;">Other Options</div>

        <div class="pay-option clickable" onclick="selectPayment(this)">
            <div class="pay-details">
                <div class="pay-icon" style="background: #fff8eb; color: #ff5200;"><i class="fa-solid fa-money-bill-wave"></i></div>
                <h4>Cash on Delivery (COD)</h4>
            </div>
            <div class="radio-circle active"></div>
        </div>
    </div>

    <div class="pay-btn-container">
        <button class="btn-pay clickable" id="payBtn" onclick="processPayment()">Pay Now</button>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyC9PnjAdBeOEy0TLQvUBJUznlZFKSS82uI",
            authDomain: "sri-vishnu-priya-finance-c591f.firebaseapp.com",
            databaseURL: "https://sri-vishnu-priya-finance-c591f-default-rtdb.firebaseio.com",
            projectId: "sri-vishnu-priya-finance-c591f",
            storageBucket: "sri-vishnu-priya-finance-c591f.firebasestorage.app",
            messagingSenderId: "184676228358",
            appId: "1:184676228358:web:7ef47b55ab678bb0dfd287"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const database = firebase.database();

        let finalAmountToPay = 0;
        let cartData = JSON.parse(localStorage.getItem('localBoyCart'));

        window.onload = function() {
            if(!cartData || cartData.totalQty === 0) {
                window.location.replace("home.html");
                return;
            }

            document.getElementById('payBtn').disabled = true;

            // Fetch live menu to calculate accurate total
            let dbRefPath = cartData.restId === 'grocery_store' ? 'groceries' : 'restaurant_menus/' + cartData.restId;

            database.ref(dbRefPath).once('value').then((snapshot) => {
                let menuDB = snapshot.val() || {};
                let itemTotal = 0;
                
                for (let id in cartData.items) { 
                    let item = menuDB[id];
                    if(item) {
                        itemTotal += (item.price * cartData.items[id]); 
                    }
                } 
                
                let deliveryFee = 30; 
                let taxes = 25;
                
                finalAmountToPay = itemTotal + deliveryFee + taxes;
                
                document.getElementById('payAmount').innerText = `₹${finalAmountToPay.toFixed(2)}`;
                document.getElementById('payBtn').disabled = false;
            }).catch(err => {
                alert("Network error. Please try again.");
                window.location.replace("cart.html");
            });
        };

        function selectPayment(element) { 
            document.querySelectorAll('.radio-circle').forEach(el => el.classList.remove('active')); 
            element.querySelector('.radio-circle').classList.add('active'); 
        }

        function processPayment() { 
            const btn = document.getElementById('payBtn');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing Order...'; 
            btn.disabled = true;

            const userPhone = localStorage.getItem('userPhone');
            const profileData = JSON.parse(localStorage.getItem('userProfileData')) || {};
            const savedAddress = localStorage.getItem('userSavedAddress') || "Address not specified";

            // Extract Name safely
            let cName = "Guest";
            if(profileData.firstName) {
                cName = profileData.firstName + (profileData.lastName ? " " + profileData.lastName : "");
            }

            // Generate unique Order ID (e.g., LB849302)
            const generatedOrderId = "LB" + Math.floor(100000 + Math.random() * 900000);

            const orderData = {
                orderId: generatedOrderId,
                customerId: userPhone || "Unknown",
                customerName: cName,
                customerPhone: userPhone || "Unknown",
                deliveryAddress: savedAddress,
                restaurantId: cartData.restId,
                items: cartData.items,
                totalAmount: finalAmountToPay,
                status: 'Placed',
                timestamp: Date.now(),
                paymentMethod: 'Cash on Delivery' // Defaulting to COD for now
            };

            // Push to Firebase Realtime Database
            database.ref('orders/' + generatedOrderId).set(orderData).then(() => {
                // Save Order ID locally so success/track page knows what to track
                localStorage.setItem('lastOrderId', generatedOrderId);
                localStorage.setItem('activeOrder', 'true');
                
                // Redirect to success page
                window.location.replace("success.html"); 
            }).catch((error) => {
                alert("Failed to place order: " + error.message);
                btn.innerHTML = 'Pay Now'; 
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
