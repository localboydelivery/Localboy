<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOCAL BOY - Payment</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #f8fafc; color: #1e293b; padding-bottom: 90px; }
        a { text-decoration: none; color: inherit; }
        .clickable:active { transform: scale(0.97); opacity: 0.9; }

        .top-bar { display: flex; align-items: center; padding: 15px 20px; background: #ffffff; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
        .back-btn { font-size: 20px; margin-right: 15px; width: 38px; height: 38px; display: flex; justify-content: center; align-items: center; border-radius: 50%; background: #f1f5f9; cursor: pointer; color: #1e293b; transition: 0.2s;}
        .top-bar h2 { font-size: 18px; font-weight: 800; color: #0f172a;}

        .amount-card { background: #ffffff; margin: 20px; padding: 25px; border-radius: 20px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.02); border: 1px solid #f1f5f9;}
        .amount-card p { font-size: 14px; color: #64748b; font-weight: 600; margin-bottom: 5px; }
        .amount-card h1 { font-size: 32px; font-weight: 800; color: #0f172a; }

        .payment-section { background: #ffffff; margin: 0 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); overflow: hidden; border: 1px solid #f1f5f9;}
        .payment-title { font-size: 13px; font-weight: 700; padding: 20px 20px 10px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px;}
        
        .pay-option { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid #f1f5f9; cursor: pointer; transition: 0.2s;}
        .pay-option:active { background: #f8fafc; }
        .pay-details { display: flex; align-items: center; gap: 15px; }
        .pay-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 20px; }
        .pay-details h4 { font-size: 15px; font-weight: 700; color: #1e293b; }
        
        .radio-circle { width: 22px; height: 22px; border: 2px solid #cbd5e0; border-radius: 50%; display: flex; justify-content: center; align-items: center; transition: 0.2s;}
        .radio-circle.active { border-color: #10b981; }
        .radio-circle.active::after { content: ''; width: 12px; height: 12px; background: #10b981; border-radius: 50%; }

        .pay-btn-container { position: fixed; bottom: 0; left: 0; width: 100%; background: #ffffff; padding: 15px 20px; box-shadow: 0 -10px 30px rgba(0,0,0,0.05); z-index: 1000; border-top-left-radius: 24px; border-top-right-radius: 24px;}
        .btn-pay { width: 100%; background: #ff5200; color: white; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 800; border: none; cursor: pointer; box-shadow: 0 8px 20px rgba(255, 82, 0, 0.25);}
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="javascript:history.back()" class="back-btn clickable"><i class="fa-solid fa-arrow-left"></i></a>
        <h2>Payments</h2>
    </div>

    <div class="amount-card">
        <p>Amount to Pay</p>
        <h1 id="payAmount">₹0.00</h1>
    </div>

    <div class="payment-section">
        <div class="payment-title">Recommended Options</div>
        
        <div class="pay-option clickable" onclick="selectPayment(this)">
            <div class="pay-details">
                <div class="pay-icon" style="background: #ecfdf5; color: #10b981;"><i class="fa-brands fa-google-pay"></i></div>
                <h4>Google Pay</h4>
            </div>
            <div class="radio-circle active"></div>
        </div>

        <div class="pay-option clickable" onclick="selectPayment(this)">
            <div class="pay-details">
                <div class="pay-icon" style="background: #eff6ff; color: #3b82f6;"><i class="fa-solid fa-building-columns"></i></div>
                <h4>PhonePe / UPI</h4>
            </div>
            <div class="radio-circle"></div>
        </div>

        <div class="payment-title" style="border-top: 6px solid #f8fafc;">Other Options</div>

        <div class="pay-option clickable" onclick="selectPayment(this)">
            <div class="pay-details">
                <div class="pay-icon" style="background: #fff8eb; color: #ff5200;"><i class="fa-solid fa-money-bill-wave"></i></div>
                <h4>Cash on Delivery (COD)</h4>
            </div>
            <div class="radio-circle"></div>
        </div>
    </div>

    <div class="pay-btn-container">
        <button class="btn-pay clickable" onclick="processPayment()">Pay Now</button>
    </div>

    <script>
        // 🔴 SIMPLE & BULLETPROOF CALCULATION
        window.onload = function() {
            const cartData = JSON.parse(localStorage.getItem('localBoyCart'));
            
            // కార్ట్‌లో ఐటెమ్స్ లేకపోతేనే వెనక్కి పంపుతుంది
            if(!cartData || cartData.totalQty === 0) {
                window.location.href = "home.html";
                return;
            }

            const menuDB = {
                // Food
                '1': 280, '2': 220, '3': 190,
                // Groceries
                'g1': 45, 'g2': 30, 'g3': 28, 'g4': 140, 'g5': 160, 'g6': 1250,
                'g7': 20, 'g8': 40, 'g9': 140, 'g10': 20, 'g11': 15, 'g12': 30
            };

            let itemTotal = 0;
            
            if(cartData.items) { 
                for (let id in cartData.items) { 
                    // ఐడీ దొరికితే ఆ రేటు తీసుకుంటుంది, లేదంటే డిఫాల్ట్ గా 0
                    let price = menuDB[id] || 0; 
                    itemTotal += (price * cartData.items[id]); 
                } 
            }
            
            let deliveryFee = 30; 
            let discount = Math.round(itemTotal * 0.10); 
            let taxes = 25;
            
            // ఫైనల్ అమౌంట్
            let toPay = itemTotal + deliveryFee - discount + taxes;
            
            // అమౌంట్ ఎంత వచ్చినా సరే.. ఇక్కడే ఉండి చూపిస్తుంది
            document.getElementById('payAmount').innerText = `₹${toPay.toFixed(2)}`;
        };

        function selectPayment(element) { 
            document.querySelectorAll('.radio-circle').forEach(el => el.classList.remove('active')); 
            element.querySelector('.radio-circle').classList.add('active'); 
        }

        function processPayment() { 
            const btn = document.querySelector('.btn-pay');
            btn.innerText = "Processing..."; 
            btn.style.opacity = "0.8";
            
            setTimeout(() => { 
                window.location.href = "success.html"; 
            }, 1500); 
        }
    </script>
</body>
</html>
