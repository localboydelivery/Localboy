<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOCAL BOY - Login</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #ffffff; color: #1e293b; height: 100vh; display: flex; flex-direction: column; }
        .clickable:active { transform: scale(0.97); opacity: 0.9; }

        /* Splash Image Section */
        .splash-img-container { flex: 1; background: #ecfdf5; display: flex; justify-content: center; align-items: center; border-bottom-left-radius: 40px; border-bottom-right-radius: 40px; position: relative; overflow: hidden;}
        .splash-img-container img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8;}
        
        /* App Logo Box */
        .logo-box { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); text-align: center; background: #ffffff; padding: 20px 30px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 80%;}
        .logo-box i { font-size: 50px; color: #ff5200; margin-bottom: 10px;}
        .logo-box h1 { font-size: 28px; font-weight: 800; color: #0f172a; letter-spacing: -1px;}
        .logo-box p { font-size: 13px; color: #10b981; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-top: 5px;}

        /* Login Section */
        .login-section { padding: 40px 20px; text-align: center; }
        .login-title { font-size: 22px; font-weight: 800; color: #0f172a; margin-bottom: 8px;}
        .login-subtitle { font-size: 14px; color: #64748b; font-weight: 500; margin-bottom: 30px;}

        /* Login Buttons */
        .btn-phone { width: 100%; background: #ff5200; color: white; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 800; border: none; cursor: pointer; box-shadow: 0 8px 20px rgba(255, 82, 0, 0.25); display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 15px;}
        .btn-google { width: 100%; background: #ffffff; color: #1e293b; padding: 16px; border-radius: 14px; font-size: 15px; font-weight: 700; border: 1px solid #e2e8f0; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.02);}

        .terms { font-size: 11px; color: #94a3b8; font-weight: 500; margin-top: 25px;}
        .terms a { color: #10b981; text-decoration: underline;}
    </style>
</head>
<body>

    <div class="splash-img-container">
        <!-- Background Image -->
        <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=600&auto=format&fit=crop" alt="Food Delivery">
        
        <div class="logo-box">
            <i class="fa-solid fa-motorcycle"></i>
            <h1>LOCAL BOY</h1>
            <p>Food & Groceries</p>
        </div>
    </div>

    <div class="login-section">
        <h2 class="login-title">Get Started with Local Boy</h2>
        <p class="login-subtitle">Enter your details to find food and groceries near you.</p>

        <!-- For now, we will redirect straight to home page to keep testing easy -->
        <button class="btn-phone clickable" onclick="loginSuccess()">
            <i class="fa-solid fa-phone"></i> Continue with Phone
        </button>
        
        <button class="btn-google clickable" onclick="loginSuccess()">
            <i class="fa-brands fa-google" style="color: #ea4335;"></i> Continue with Google
        </button>

        <p class="terms">By continuing, you agree to our <br> <a href="#">Terms of Service</a> & <a href="#">Privacy Policy</a></p>
    </div>

    <!-- 🔴 FIREBASE INTEGRATION (Based on your JSON file) -->

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <script>
        // Your specific Firebase configuration
        const firebaseConfig = {

            authDomain: "local-boy-2a05e.firebaseapp.com",
            databaseURL: "https://local-boy-2a05e-default-rtdb.firebaseio.com",

            messagingSenderId: "717569157806",
            appId: "1:717569157806:web:YOUR_APP_ID" // We will update this later if needed
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Dummy Login Action (Will link real OTP later)

            // Setting a test user profile in Local Storage
            const profileData = { firstName: "Local", lastName: "Boy User", email: "user@localboy.com" };

            // Go to home page
            window.location.href = "home.html";

</body>
</html>
